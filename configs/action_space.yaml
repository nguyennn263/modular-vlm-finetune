# Discrete action space for the policy (final-plan section 5.2).
# n_tiles grid is calibrated in P1; bridges are filled in after the P3 fork.

n_tiles: [1, 3, 6]          # InternViT forward count (primary compute lever)
bridges: []                 # top-3 from Exp B fork (P3); e.g. [residual, tile_attention, qformer]

lambda_grid: [0.0, 0.05, 0.1, 0.2, 0.4, 0.7, 1.0]   # oracle utility-cost sweep

# C(a) = alpha * n_tiles/max(n_tiles) + beta * k/max(k)   (k = bridge vision-token count)
cost:
  alpha: 1.0
  beta: 0.0                 # raised only if P1 shows the bridge axis carries real FLOPs

metric: cider               # M(a; x), continuous
decoding: greedy
